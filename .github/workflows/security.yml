name: security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock for known vulnerabilities
        run: cargo audit

  fuzz-long:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fuzz-target: [parser, type_expr, lowering_stub, checker]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run scheduled fuzz target
        run: cargo +nightly fuzz run ${{ matrix.fuzz-target }} -- -max_total_time=300

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-long-${{ matrix.fuzz-target }}-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
