[project]
src = ["src"]
include = ["src/**/*.tpy", "src/**/*.py", "src/**/*.pyi"]
exclude = [".typepython/**", "dist/**"]
root_dir = "src"
out_dir = ".typepython/build"
cache_dir = ".typepython/cache"
target_python = "3.12"

[typing]
profile = "application"
strict = true
strict_nulls = true
imports = "unknown"
warn_unsafe = true

[experimental]
# Taint syntax is present in the source, but the strict taint checker slice stays
# in focused crate fixtures until this demo opts into `"taint"` as well.
accepted_features = ["shape_transforms", "effect_rows", "validator_witnesses"]
shape_transforms = true

[emit]
emit_pyi = true
write_py_typed = true
no_emit_on_error = true
runtime_validators = false
